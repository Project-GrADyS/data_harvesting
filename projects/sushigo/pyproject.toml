[project]
name = "sushigo"
version = "0.1.0"
description = "Independent multi-agent DQN training and league evaluation for Sushi Go"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flex-marl>=0.1.0",
    "gymnasium>=1.2.0",
    "mlflow>=3.4.0",
    "numpy>=2.2.6",
    "pettingzoo==1.24.3",
    "pyyaml>=6.0.2",
    "rl-core[mlflow]>=0.1.0",
    "tensordict>=0.10.0",
    "torch>=2.9.1",
    "torchrl>=0.13.3",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
