[project]
name = "data-harvesting"
version = "0.1.0"
description = "Multi-agent reinforcement-learning project for autonomous data harvesting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flex-marl>=0.1.0",
    "gradysim>=0.7.3",
    "gymnasium>=1.2.0",
    "hyperopt>=0.2.7",
    "jupyter>=1.1.1",
    "line-profiler>=5.0.0",
    "matplotlib>=3.10.6",
    "mlflow>=3.4.0",
    "numpy>=2.2.6",
    "pettingzoo==1.24.3",
    "pyyaml>=6.0.2",
    "rl-core[mlflow]>=0.1.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torchrl>=0.10.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "vmas>=1.5.0",
]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
