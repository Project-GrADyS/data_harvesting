[project]
name = "d-atc"
version = "0.1.0"
description = "Distributed reinforcement learning for air traffic control"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bluesky-simulator[full]>=1.1.1",
    "gradysim>=0.7.3",
    "pyproj>=3.7.2",
    "validation-core",
]

[project.scripts]
benchmark-bsky = "d_atc.benchmark:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
