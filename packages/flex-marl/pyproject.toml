[project]
name = "flex-marl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thlamz", email = "thlamenza@hotmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.9.1",
    "torchrl>=0.10.1",
    "torchvision>=0.24.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
